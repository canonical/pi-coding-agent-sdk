name: pi-coding-agent
title: Pi Coding Agent CLI SDK
adopt-info: pi
summary: Pi Coding Agent CLI - AI-powered coding assistant for the terminal
description: |
  This SDK provides the Pi Coding Agent CLI for AI-assisted coding within a
  workshop. The agent is sandboxed in the workshop container. Credentials are
  persisted between workshop updates.
license: MIT
build-base: ubuntu@24.04
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [amd64]
    build-for: [arm64]
  riscv64:
    build-on: [amd64]
    build-for: [riscv64]

plugs:
  pi-config:
    interface: mount
    workshop-target: /home/workshop/.pi

parts:
  pi:
    plugin: npm
    source: .
    npm-include-node: true
    npm-node-version: 22.22.1
    override-pull: |
      VERSION=$(cat "$CRAFT_PROJECT_DIR/VERSION")
      craftctl set version="$VERSION"
      curl -fLO "https://registry.npmjs.org/@earendil-works/pi-coding-agent/-/pi-coding-agent-${VERSION}.tgz"
      tar -xzf "pi-coding-agent-${VERSION}.tgz" --strip-components=1 -C "$CRAFT_PART_SRC"
      rm "pi-coding-agent-${VERSION}.tgz"

  workshop-prompt:
    plugin: dump
    source: workshop-prompt.md
    source-type: file
