name: pi-coding-agent
title: Pi Coding Agent CLI SDK
adopt-info: pi
summary: Pi Coding Agent CLI - AI-powered coding assistant for the terminal
description: |
  This SDK provides the Pi Coding Agent CLI for AI-assisted coding within a
  workshop. The agent is sandboxed in the workshop container. Credentials are
  persisted between workshop updates.
license: MIT
build-base: ubuntu@24.04
platforms:
  # Build each arch natively: npm-include-node downloads node for the build
  # host, so cross-building would bundle the wrong-arch node. riscv64 is omitted
  # (pi needs node >=20.6.0 and Node.js publishes no linux-riscv64 binary).
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]

plugs:
  pi-config:
    interface: mount
    workshop-target: /home/workshop/.pi

parts:
  pi:
    plugin: npm
    source: .
    npm-include-node: true
    npm-node-version: 22.22.1
    override-pull: |
      VERSION=$(cat "$CRAFT_PROJECT_DIR/VERSION")
      craftctl set version="$VERSION"
      PUBLISHED_AT=$(curl -fsSLO -w "%header{last-modified}" "https://registry.npmjs.org/@earendil-works/pi-coding-agent/-/pi-coding-agent-${VERSION}.tgz")
      test -n "$PUBLISHED_AT"
      tar -xzf "pi-coding-agent-${VERSION}.tgz" --strip-components=1 -C "$CRAFT_PART_SRC"
      rm "pi-coding-agent-${VERSION}.tgz"
      find "$CRAFT_PART_SRC" -type f -exec touch -d "$PUBLISHED_AT" {} +

  ripgrep:
    plugin: rust
    rust-channel: stable
    source: https://github.com/BurntSushi/ripgrep.git
    source-tag: 15.1.0

  sd:
    plugin: rust
    rust-channel: stable
    source: https://github.com/sharkdp/fd.git
    source-tag: v10.4.2

  workshop-prompt:
    plugin: dump
    source: workshop-prompt.md
    source-type: file
