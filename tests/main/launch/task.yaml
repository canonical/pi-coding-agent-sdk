summary: Launch a workshop with the pi-coding-agent SDK

prepare: |
  envsubst '${BASE}' <workshop.yaml.in >workshop.yaml
  workshop launch

restore: |
  workshop remove || true

execute: |
  # `workshop launch` is a blocking, fail-fast call: if it returned 0 in
  # prepare, the workshop is fully provisioned with our SDK applied
  # (including check-health reporting okay).
  workshop info | MATCH 'status:\s+ready'
  workshop exec -- true

debug: |
  workshop tasks
